<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign Up — DailyTracker</title>
  <meta name="description" content="DailyTracker — track tasks, expenses and budget" />
  <meta name="theme-color" content="#0d9488" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="DailyTracker" />
  <link rel="manifest" href="/manifest.json" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body class="auth-page">

  <div class="auth-split">

    <!-- Left panel — illustration -->
    <div class="auth-banner">
      <div class="auth-banner-content">
        <div class="banner-logo">
          <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 11l3 3L22 4" />
            <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
          </svg>
        </div>
        <h2 class="banner-title">DailyTracker</h2>
        <p class="banner-sub">Start your productivity journey today</p>

        <!-- Illustration -->
        <div class="banner-illustration">
          <img
            src="https://images.unsplash.com/photo-1554224155-6726b3ff858f?w=600&q=85&auto=format&fit=crop"
            alt="Finance tracking"
          />
        </div>

        <div class="banner-features">
          <div class="banner-feature">
            <span class="feature-dot"></span>
            Free forever — no credit card needed
          </div>
          <div class="banner-feature">
            <span class="feature-dot"></span>
            Your data is private and secure
          </div>
          <div class="banner-feature">
            <span class="feature-dot"></span>
            Works on mobile and desktop
          </div>
        </div>
      </div>
    </div>

    <!-- Right panel — form -->
    <div class="auth-form-panel">
      <div class="auth-card">
        <div class="auth-logo">
          <div class="auth-logo-icon">
            <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4" />
              <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
            </svg>
          </div>
          <span class="auth-logo-text">DailyTracker</span>
        </div>

        <h1 class="auth-title">Create account</h1>
        <p class="auth-subtitle">Start tracking your tasks and expenses</p>

        <div class="error-msg" id="errorMsg"></div>

        <form id="signupForm" novalidate>
          <div class="form-group">
            <label for="username">Username</label>
            <input type="text" id="username" name="username" placeholder="yourname" autocomplete="username" required />
          </div>
          <div class="form-group">
            <label for="password">Password</label>
            <div class="password-wrap">
              <input type="password" id="password" name="password" placeholder="At least 6 characters" autocomplete="new-password" required />
              <button type="button" class="btn-toggle-pw" onclick="togglePassword('password', this)" aria-label="Show password">
                <svg class="eye-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                <svg class="eye-off-icon" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              </button>
            </div>
          </div>
          <button type="submit" class="btn-primary" id="submitBtn">Create account</button>
        </form>

        <div class="auth-footer">
          Already have an account? <a href="/index.html">Sign in</a>
        </div>
      </div>
    </div>

  </div>

  <script src="/js/auth.js"></script>
  <script>
    if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js'); }
    function togglePassword(id, btn) {
      const input = document.getElementById(id);
      const isHidden = input.type === 'password';
      input.type = isHidden ? 'text' : 'password';
      btn.querySelector('.eye-icon').style.display = isHidden ? 'none' : '';
      btn.querySelector('.eye-off-icon').style.display = isHidden ? '' : 'none';
    }
  </script>
</body>
</html>
