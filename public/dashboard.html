<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard — DailyTracker</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar">
    <a href="/dashboard.html" class="nav-logo">
      <div class="nav-logo-icon">
        <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4" />
          <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
        </svg>
      </div>
      <span class="nav-logo-text">DailyTracker</span>
    </a>
    <div class="nav-right">
      <span class="nav-user">Hello, <span id="navUsername">...</span></span>
      <button class="btn-logout" id="logoutBtn">Log out</button>
    </div>
  </nav>

  <!-- Main content -->
  <main class="dashboard-main">
    <div class="dashboard-header">
      <div class="dashboard-hero">
        <img
          src="https://images.unsplash.com/photo-1506784983877-45594efa4cbe?w=1200&q=80&auto=format&fit=crop"
          alt="Productive day"
          class="hero-img"
        />
        <div class="hero-overlay">
          <h1 id="dashGreeting">Good day!</h1>
          <p>Here's your overview for today.</p>
        </div>
      </div>
    </div>

    <div class="dashboard-grid">

      <!-- ── Tasks Section ── -->
      <div class="card">
        <div class="card-header">
          <div class="card-header-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 11l3 3L22 4" />
              <path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11" />
            </svg>
          </div>
          <div>
            <div class="card-header-title">Tasks</div>
            <div class="card-header-sub" id="taskCount">0 tasks</div>
          </div>
        </div>
        <div class="card-body">
          <!-- Add task -->
          <div class="add-form">
            <input type="text" id="taskInput" placeholder="Add a new task…" maxlength="200" />
            <button class="btn-add" id="addTaskBtn">
              <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Add
            </button>
          </div>
          <span class="inline-error" id="taskError"></span>

          <!-- Task list -->
          <ul class="task-list" id="taskList">
            <li class="empty-state" id="taskEmpty">
              <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                <rect x="3" y="3" width="18" height="18" rx="2" />
                <path d="M9 12l2 2 4-4" />
              </svg>
              No tasks yet. Add one above!
            </li>
          </ul>
        </div>
      </div>

      <!-- ── Expenses Section ── -->
      <div class="card">
        <div class="card-header">
          <div class="card-header-icon">
            <svg viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10" />
              <path d="M12 6v2m0 8v2M9.5 9.5a2.5 2.5 0 015 0c0 1.5-1.5 2-2.5 2.5S9.5 14.5 9.5 16h5" />
            </svg>
          </div>
          <div>
            <div class="card-header-title">Expenses</div>
            <div class="card-header-sub" id="expenseCount">0 expenses</div>
          </div>
        </div>
        <div class="card-body">
          <!-- Add expense form -->
          <div class="expense-form" id="expenseForm">
            <input type="number" id="expAmount" placeholder="Amount (₹)" min="0.01" step="0.01" />
            <input type="text" id="expCategory" placeholder="Category" maxlength="80" />
            <input type="text" id="expDescription" placeholder="Description (optional)" class="full-width" maxlength="200" />
            <input type="date" id="expDate" class="full-width" />
            <button class="btn-add-expense" id="addExpenseBtn">
              <svg viewBox="0 0 24 24" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Add Expense
            </button>
          </div>
          <span class="inline-error" id="expenseError"></span>

          <!-- Stats -->
          <div class="stats-bar">
            <div class="stat-box">
              <div class="stat-label">Total Spent</div>
              <div class="stat-value" id="totalSpent">₹0.00</div>
            </div>
            <div class="stat-box">
              <div class="stat-label">Monthly Avg</div>
              <div class="stat-value" id="monthlyAvg">₹0.00</div>
            </div>
          </div>

          <!-- Expense table -->
          <div class="expense-table-wrap">
            <table class="expense-table" id="expenseTable">
              <thead>
                <tr>
                  <th>Date</th>
                  <th>Amount</th>
                  <th>Category</th>
                  <th>Description</th>
                  <th></th>
                </tr>
              </thead>
              <tbody id="expenseBody">
                <tr id="expenseEmpty">
                  <td colspan="5">
                    <div class="empty-state">
                      <svg viewBox="0 0 24 24" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10" />
                        <path d="M12 8v4m0 4h.01" />
                      </svg>
                      No expenses yet. Add one above!
                    </div>
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </main>

  <script src="/js/dashboard.js"></script>
</body>
</html>
